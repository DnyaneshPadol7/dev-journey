<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../common.css">
</head>
<body>
    
    <div class="container">
        <form id="loginForm" action="./login.php" method="post" onsubmit="">
            <h1>Login</h1>
            <label for="username">Enter Username</label>
            <input type="text" id="userName" name="userName" required>
            <small id="userNameError" class="error"></small>

            <label for="password">Enter Password</label>
            <input type="password" name="password" id="password" required>
            <small id="passwordError" class="error"></small>

            <input type="hidden" name="role" value="Anonymous">

            <button name="submit">Login</button>

            <div class="newAc">
                <div class="register"><a href="register.html">Don't have Account</a></div>
                <div class="forget"><a href="../ForgetPass/forgotpass.html">Forget password</a></div>
            </div>
           
        </form>
    </div>
    <!-- SweetAlert library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- JS of login -->
    <script src="login.js"></script>
</body>
</html>
