<body>
    <body class="d-flex justify-content-center align-items-center ">
    
   
        <div class="container">
            <!-- <div class="con2"> -->
            <h1>Add Customer</h1>
            <form action="../Customer/addCustomer.php" method="post" onsubmit="return validateForm() ">
                <label for="username">Enter Customer Name</label>
                <input type="text" id="username" name="customer_name" onblur="checkUsername()" required><span id="spm"></span>
                <label for="mobileNo">Enter Mobile No.</label>
                <input type="tel" id="mobileNo" name="mobileNo" onblur=" checkMobile()" required><span id="spmm"></span>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" onblur="checkEmail()" required><span id="spme"></span>
                <label for="address">Enter Address</label>
                <input type="text" id="address" name="address" onblur="chekaddress()" required><span id="s"></span>
                

                <button class="" name="submit">Submit</button>
            </form>
            <!-- </div> -->
        </div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
