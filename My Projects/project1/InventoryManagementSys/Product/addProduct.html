<body class="d-flex justify-content-center align-items-center ">


    <div class="containerAddProdcut">
        <!-- <div class="con2"> -->
        <h1>Add Product</h1>
        <form action="../Product/addProduct.php" autocomplete="off" method="post" onsubmit="return validateForm() ">
            <label for="UserName">Product Name</label>
            <input type="text" id="product" name="product_name" required><span id="spm"></span>

            <label for="category">Product Category</label>
            <select id="category" name="category" required>
                <option value="">-- Select Category --</option>
                <option value="clothes">Clothes</option>
                <option value="beauty">Beauty</option>
                <option value="grocery">Grocery</option>
                <option value="electronics">Electronics</option>
                <option value="toys">Toys</option>
                <option value="furniture">Furniture</option>
                <option value="books">Books</option>
                <option value="sports">Sports</option>
                <option value="footwear">Footwear</option> 
                <option value="jewellery">Jewellery</option>
                <option value="kitchen">Kitchen</option>
                <option value="stationery">Stationery</option>
                <option value="automobile">Automobile</option>
                <option value="health">Health & Personal Care</option>
                <option value="mobile">Mobiles & Accessories</option>
                <option value="home">Home Decor</option>
            </select>


            <label for="Mobile">Unit of Measure </label>
            <input type="text" name="measure_unit" id="unit-list" list="UOM">
            <datalist id="UOM">
                <option value="">Select Unit</option>
                <option value="Pieces"></option>
                <option value="kg"></option>
                <option value="Boxes"></option>
                <option value="Liter"></option>
                <option value="Meter"></option>

            </datalist>
            <label for="email">Enter Unit Price</label>
            <input type="number" id="unit_price" name="unit_price" required><span id="spme"></span>
            <label for="address">Description</label>
            <input type="text" id="description" name="description"><span id="s"></span>

            <button class="" name="submit">Submit to Save</button>
        </form>
        <!-- </div> -->
    </div>
